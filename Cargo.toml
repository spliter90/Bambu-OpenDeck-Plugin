[package]
name = "opendeck-bambu"
version = "0.1.0"
edition = "2024"
description = "OpenAction/OpenDeck plugin for showing Bambu Lab printer status and remaining time"
license = "MIT"

[dependencies]
openaction = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
native-tls = "0.2.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
simplelog = "0.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
