name: Publish Bambu OpenDeck Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: publish-bambu-opendeck-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          MANIFEST_VERSION="$(python3 -c 'import json; print(json.load(open("assets/manifest.json"))["Version"])')"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read Cargo.toml version" >&2
            exit 1
          fi
          if [[ "$VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Version mismatch: Cargo.toml=$VERSION manifest=$MANIFEST_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

  build:
    needs: prepare
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Linux native TLS dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Assemble plugin (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN="de.spliter90.bambu.sdPlugin"
          rm -rf "dist/$PLUGIN"
          mkdir -p "dist/$PLUGIN"
          cp -R assets/* "dist/$PLUGIN/"
          cp "target/${{ matrix.target }}/release/opendeck-bambu" "dist/$PLUGIN/opendeck-bambu-${{ matrix.target }}"
          chmod +x "dist/$PLUGIN/opendeck-bambu-${{ matrix.target }}"
          (cd dist && zip -r "../opendeck-bambu-${{ matrix.target }}.zip" "$PLUGIN")

      - name: Assemble plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plugin = "de.spliter90.bambu.sdPlugin"
          Remove-Item -Recurse -Force "dist/$plugin" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "dist/$plugin" | Out-Null
          Copy-Item -Recurse "assets/*" "dist/$plugin/"
          Copy-Item "target/${{ matrix.target }}/release/opendeck-bambu.exe" "dist/$plugin/opendeck-bambu-${{ matrix.target }}.exe"
          Compress-Archive -Path "dist/$plugin" -DestinationPath "opendeck-bambu-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: opendeck-bambu-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -lah release-assets
          COUNT="$(find release-assets -maxdepth 1 -name '*.zip' -type f | wc -l)"
          if [[ "$COUNT" -ne 5 ]]; then
            echo "Expected 5 release ZIPs, found $COUNT" >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES=".github/release-notes/$TAG.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi

          gh release create "$TAG" release-assets/*.zip \
            --target "$GITHUB_SHA" \
            --title "Bambu OpenDeck Plugin $TAG" \
            --notes-file "$NOTES" \
            --verify-tag=false

          echo "Published $TAG"
